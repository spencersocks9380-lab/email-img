<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Class | Pink Halwa Stand-up Comedy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="class-page">
      <header class="class-header">
        <p class="eyebrow">Live Class</p>
        <h1>Pink Halwa | Stand-up Comedy | Vinay Sharma</h1>
        <p class="description">
          Enjoy this live class session featuring Vinay Sharma's stand-up comedy special,
          "Pink Halwa." Press play below to watch the embedded YouTube stream.
        </p>
      </header>

      <section class="video-card" aria-label="Class video playback">
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/GS6sIZ3aNCA"
            title="Pink Halwa | Stand-up Comedy | Vinay Sharma"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </main>
  </body>
</html>
